<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #eaeaea;
      padding: 20px;
    }
    h2 { font-size: 15px; margin-bottom: 8px; color: #eaeaea; }
    p  { font-size: 12px; color: #7a7a7a; margin-bottom: 16px; line-height: 1.5; }
    #log {
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 5px;
      padding: 10px;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: #7a7a7a;
      height: 160px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    #log .ok  { color: #00ac3a; }
    #log .err { color: #f13342; }
    #log .inf { color: #00ffdd; }
    button {
      width: 100%;
      height: 40px;
      background: #eaeaea;
      color: #000;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <h2>Sapra.AI Design System</h2>
  <p>Crea la pagina "Design System" nel file con tutti i token, stili e componenti descritti nella specifica.</p>
  <div id="log"><span class="inf">Pronto. Premi "Crea Design System" per iniziare.</span></div>
  <button id="runBtn" onclick="run()">Crea Design System</button>

  <script>
    function log(msg, type) {
      const el = document.getElementById('log');
      const span = document.createElement('span');
      span.className = type || '';
      span.textContent = msg;
      el.appendChild(document.createElement('br'));
      el.appendChild(span);
      el.scrollTop = el.scrollHeight;
    }

    function run() {
      document.getElementById('runBtn').disabled = true;
      log('Avvio creazione...', 'inf');
      parent.postMessage({ pluginMessage: { type: 'run' } }, '*');
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'log') log(msg.text, msg.level);
      if (msg.type === 'done') {
        log('✅ ' + msg.text, 'ok');
        document.getElementById('runBtn').disabled = false;
        document.getElementById('runBtn').textContent = 'Ricrea Design System';
      }
      if (msg.type === 'error') {
        log('❌ ' + msg.text, 'err');
        document.getElementById('runBtn').disabled = false;
      }
    };
  </script>
</body>
</html>
